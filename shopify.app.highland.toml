# This file stores configurations for the Highland Farms install of the app.
name = "Courtyard Checkout Rules"
client_id = "494261fddf58141f16c804d5b8907fd8"
application_url = "https://courtyard-checkout-rules-4r7v.vercel.app"
embedded = true

[auth]
redirect_urls = [
  "https://courtyard-checkout-rules-4r7v.vercel.app/auth/callback",
  "https://courtyard-checkout-rules-4r7v.vercel.app/auth/shopify/callback",
  "https://courtyard-checkout-rules-4r7v.vercel.app/api/auth/callback"
]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_metaobjects,write_metaobjects,read_delivery_customizations,write_delivery_customizations,read_validations,write_validations,read_payment_customizations,write_payment_customizations"

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"
